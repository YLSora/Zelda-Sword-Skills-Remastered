name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build and generate data
        run: ./gradlew clean build runData --stacktrace
      - name: Verify generated resources are committed
        run: |
          git status --short -- src/generated/resources
          git diff --exit-code -- src/generated/resources
          test -z "$(git ls-files --others --exclude-standard -- src/generated/resources)"
      - name: Run game tests
        run: ./gradlew runGameTestServer --stacktrace
