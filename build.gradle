plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                zeldaswordskills_remastered {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run/client')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            workingDirectory project.file('run/server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file(project.hasProperty('royalCastleTests') ? 'run/royal-castle-gametest' : 'run/gametest')
            property 'forge.enabledGameTestNamespaces', project.hasProperty('royalCastleTests') ? 'zss_royal_castle_tests' : 'minecraft'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

apply from: 'gradle/verify-client-resources.gradle'
apply from: 'gradle/verify-modern-sources.gradle'

def verifyNaviFlight = tasks.register('verifyNaviFlight', JavaExec) {
    group = 'verification'
    description = 'Checks fairy wandering, following, and lock-on flight numerically.'
    dependsOn tasks.named('testClasses')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'zeldaswordskills_remastered.entity.NaviFlightCheck'
}
tasks.named('test').configure { dependsOn verifyNaviFlight }

def prepareGameTestRun = tasks.register('prepareGameTestRun', Copy) {
    doNotTrackState('The destination contains a live Minecraft world and session lock.')
    from('src/gametest/resources') {
        if (project.hasProperty('royalCastleTests')) exclude 'server.properties'
    }
    if (project.hasProperty('royalCastleTests')) from 'src/royaltest/resources'
    into project.hasProperty('royalCastleTests') ? 'run/royal-castle-gametest' : 'run/gametest'
}

tasks.configureEach {
    if (name == 'runGameTestServer') {
        dependsOn prepareGameTestRun
    }
}

repositories {
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

def resourceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        forge_version           : forge_version,
        forge_version_range     : forge_version_range,
        loader_version_range    : loader_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties resourceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand resourceProperties
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "ZeldaSwordSkills_Remaster_${minecraft_version}_${mod_version}.jar"
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    manifest {
        attributes([
                'Specification-Title'    : mod_name,
                'Specification-Vendor'   : mod_authors,
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.jar.archiveVersion,
                'Implementation-Vendor'  : mod_authors,
                'Built-On-Minecraft'     : minecraft_version
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifact sourcesJar
        }
    }
    repositories {
        maven {
            url = layout.buildDirectory.dir('repo')
        }
    }
}
